<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- 흰 큰 카드 -->
    <section class="sheet">

      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <p class="label">ABOUT ME</p>
        <div class="photo" id="photo"></div>
        <h1 class="name" id="name"></h1>
        <p class="job" id="title"></p>
        <p class="badge" id="badge"></p>

        <ul class="contacts">
          <li>
            <span class="dot-icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            </span>
            <span id="c-name"></span>
          </li>
          <li>
            <span class="dot-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            </span>
            <span id="c-email"></span>
          </li>
          <li>
            <span class="dot-icon">
              <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
            </span>
            <span id="c-phone"></span>
          </li>
          <li>
            <span class="dot-icon">
              <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
            </span>
            <span id="c-location"></span>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <div class="content">
        <h2 class="big-title">PORTFOLIO</h2>
        <p class="headline" id="headline"></p>
        <p class="intro" id="intro"></p>

        <div class="info">
          <div class="info-box">
            <h3>
              <svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>
              EDUCATION
            </h3>
            <p id="education"></p>
          </div>
          <div class="info-box">
            <h3>
              <svg viewBox="0 0 24 24"><path d="M14 6a4 4 0 0 0 5 5l-9 9a2 2 0 0 1-3-3l9-9a4 4 0 0 0-2-2z"/></svg>
              SKILLS &amp; TOOLS
            </h3>
            <p id="skills"></p>
          </div>
          <div class="info-box">
            <h3>
              <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
              EXPERIENCE
            </h3>
            <p id="experience"></p>
          </div>
        </div>

        <div class="highlights">
          <h3 class="section-title">PORTFOLIO HIGHLIGHTS</h3>
          <div class="cards" id="cards">
            <p class="note">불러오는 중…</p>
          </div>
        </div>

        <blockquote class="quote" id="quote"></blockquote>
      </div>
    </section>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h2 class="big-title">GUESTBOOK</h2>
      <p class="intro">별명과 한마디를 남겨 주세요.</p>

      <div class="gb-form">
        <input type="text" id="gb-nickname" maxlength="20" placeholder="별명 (20자까지)">
        <input type="text" id="gb-message" maxlength="200" placeholder="한마디 (200자까지)">
        <button type="button" id="gb-submit">남기기</button>
      </div>
      <p class="note" id="gb-status"></p>

      <ul class="gb-list" id="gb-list"></ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
